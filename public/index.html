<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Beras Zakat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div class="login-page">
        <div class="login-box">
            <div class="login-logo">
                <span class="icon">🌾</span>
                <h1>Beras Zakat</h1>
                <p>Sistem Pencatatan Penjualan Online</p>
            </div>

            <div class="login-card">
                <h2>Masuk ke Akun</h2>
                <div class="login-error" id="login-error"></div>

                <form id="form-login" onsubmit="doLogin(event)">
                    <div class="form-group">
                        <label>Email</label>
                        <div class="input-icon-wrap">
                            <span class="input-icon">📧</span>
                            <input type="email" id="inp-email" placeholder="email@contoh.com" required
                                autocomplete="email" />
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-icon-wrap">
                            <span class="input-icon">🔒</span>
                            <input type="password" id="inp-password" placeholder="••••••••" required
                                autocomplete="current-password" />
                        </div>
                    </div>
                    <div style="margin-top:8px">
                        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center"
                            id="btn-login">
                            Masuk →
                        </button>
                    </div>
                </form>

                <div style="margin-top:20px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
                    <p style="font-size:12px;color:var(--text-muted)">
                        Belum punya akun? Hubungi administrator untuk mendapatkan akses.
                    </p>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script type="module">
        import { auth } from './assets/js/firebase-config.js';
        import { signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { db } from './assets/js/firebase-config.js';

        // Jika sudah login, redirect
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const snap = await getDoc(doc(db, 'users', user.uid));
                if (snap.exists()) {
                    const role = snap.data().role;
                    window.location.href = role === 'admin' ? 'admin.html' : 'penjual.html';
                }
            }
        });

        window.doLogin = async function (e) {
            e.preventDefault();
            const email = document.getElementById('inp-email').value.trim();
            const password = document.getElementById('inp-password').value;
            const btn = document.getElementById('btn-login');
            const errEl = document.getElementById('login-error');

            btn.textContent = 'Memproses...';
            btn.disabled = true;
            errEl.classList.remove('show');

            try {
                const cred = await signInWithEmailAndPassword(auth, email, password);
                const snap = await getDoc(doc(db, 'users', cred.user.uid));
                if (!snap.exists()) throw new Error('Data user tidak ditemukan. Hubungi admin.');
                const role = snap.data().role;
                window.location.href = role === 'admin' ? 'admin.html' : 'penjual.html';
            } catch (err) {
                let msg = 'Login gagal. Periksa email dan password.';
                if (err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                    msg = 'Email atau password salah.';
                } else if (err.code === 'auth/too-many-requests') {
                    msg = 'Terlalu banyak percobaan. Coba beberapa menit lagi.';
                } else if (err.message) {
                    msg = err.message;
                }
                errEl.textContent = '⚠ ' + msg;
                errEl.classList.add('show');
                btn.textContent = 'Masuk →';
                btn.disabled = false;
            }
        };
    </script>
</body>

</html>
